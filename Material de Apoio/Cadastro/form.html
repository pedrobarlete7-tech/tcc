<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 text-center mb-4">Cadastro de Usuário</h1>

                        <form action="processa_cadastro.php" method="POST" class="needs-validation" novalidate>
                            
                            <!-- Nome -->
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="nome" 
                                    name="nome" 
                                    maxlength="120"
                                    required
                                >
                                <div class="invalid-feedback">
                                    Informe o nome completo.
                                </div>
                            </div>

                            <!-- E-mail -->
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="email" 
                                    name="email" 
                                    maxlength="120"
                                    required
                                >
                                <div class="invalid-feedback">
                                    Informe um e-mail válido.
                                </div>
                            </div>

                            <!-- Tipo de usuário -->
                            <div class="mb-3">
                                <label for="tipo_usuario" class="form-label">Tipo de usuário</label>
                                <select 
                                    class="form-select" 
                                    id="tipo_usuario" 
                                    name="tipo_usuario" 
                                    required
                                >
                                    <option value="">Selecione...</option>
                                    <option value="aluno">Aluno</option>
                                    <option value="professor">Professor</option>
                                </select>
                                <div class="invalid-feedback">
                                    Selecione o tipo de usuário.
                                </div>
                            </div>

                            <div class="row">
                                <!-- Senha -->
                                <div class="col-md-6 mb-3">
                                    <label for="senha" class="form-label">Senha</label>
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="senha" 
                                        name="senha" 
                                        minlength="6"
                                        required
                                    >
                                    <div class="invalid-feedback">
                                        Informe uma senha com pelo menos 6 caracteres.
                                    </div>
                                </div>

                                <!-- Confirmar senha -->
                                <div class="col-md-6 mb-3">
                                    <label for="confirmar_senha" class="form-label">Confirmar senha</label>
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="confirmar_senha" 
                                        name="confirmar_senha" 
                                        minlength="6"
                                        required
                                    >
                                    <div class="invalid-feedback">
                                        Confirme a senha.
                                    </div>
                                </div>
                            </div>

                            <!-- Termos -->
                            <div class="form-check mb-4">
                                <input 
                                    class="form-check-input" 
                                    type="checkbox" 
                                    value="1" 
                                    id="termos" 
                                    required
                                >
                                <label class="form-check-label" for="termos">
                                    Declaro que as informações fornecidas são verdadeiras.
                                </label>
                                <div class="invalid-feedback">
                                    É necessário confirmar esta opção.
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Cadastrar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (() => {
            'use strict';

            const forms = document.querySelectorAll('.needs-validation');

            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    const senha = document.getElementById('senha').value;
                    const confirmarSenha = document.getElementById('confirmar_senha').value;

                    if (!form.checkValidity() || senha !== confirmarSenha) {
                        event.preventDefault();
                        event.stopPropagation();

                        if (senha !== confirmarSenha) {
                            document.getElementById('confirmar_senha').setCustomValidity('As senhas não coincidem.');
                        } else {
                            document.getElementById('confirmar_senha').setCustomValidity('');
                        }
                    } else {
                        document.getElementById('confirmar_senha').setCustomValidity('');
                    }

                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>

</body>
</html>
