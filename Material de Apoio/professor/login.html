<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="contant">
        <form class="formulario">
            <h2>Login</h2>
            <div class="input-box">
                <input type="text" placeholder="Usuario">
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email">
            </div>
            <div class="input-box">
                <input type="password" placeholder="Senha">
            </div>
            <div>
                <label>
                    <input type="checkbox">
                    Lembrar-me
                </label>
            </div>
                <button type="submit">Login</button>
            <div>
                Esqueceu sua senha <a href="">Clique aqui!</a></label>
            </div>
        </form>
    </div>
</body>
</html>
