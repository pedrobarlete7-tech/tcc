<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }
        .formulario h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .box {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            border: black solid 5px;
        }


    </style>
</head>
<body>
<div class="box">
    <div class="contant">
        <form class="formulario">
            <h2>Login</h2>

            <div class="input-box">
                <input type="text" placeholder="Usuário">
            </div>

            <div class="input-box">
                <input type="password" placeholder="Senha">
            </div>

            <div>
                <label>
                    <input type="checkbox">
                    Lembrar-me
                </label>
            </div>

            <button type="submit">Login</button>

            <div class="links">
                <p>Esqueceu sua senha? <a href="#">Clique aqui!</a></p>
                <p>Não tem cadastro? <a href="#">Clique aqui</a></p>
            </div>
        </form>
    </div>
</div>
</body>
</html>
