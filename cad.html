<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cad.css">
</head>
<body>
  
  <div class="caixa">
    <h2>Cadastre-se</h2>
  <form class="row g-3 needs-validation" novalidate>
      <div class="campoNome">
        <!-- <label for="validationCustom01" class="form-label">Nome</label> -->
        <input type="text" class="form-control" id="validationCustom01" placeholder="Insira seu nome completo" required>
      </div>
  
      <div class="campoEmail">
        <!-- <label for="validationCustomUsername" class="form-label">E-mail</label> -->
        <div class="input-group has-validation">
          <input type="email" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" placeholder="Insira seu E-mail" minlength="6" required>
          <div class="invalid-feedback">
            Por favor coloque seu E-mail!
          </div>
        </div>
      </div>
      
      <div class="campoSenha">
        <!-- <label for="validationCustom05" class="form-label">Senha</label> -->
        <input type="password" class="form-control" id="validationCustom05" placeholder="Insira sua senha" required>
        <div class="invalid-feedback">
          É necessario uma senha!
        </div>
      </div>
      <div class="confirmaSenha">
        <!-- <label for="validationCustom01" class="form-label">Confirmacao</label> -->
        <input type="password" class="form-control" id="validationCustom05" placeholder="Confirme a sua senha!" required>
        <div class="VerificarSenha"></div>
      </div>
  
      <div class="col-12">
        <!-- <div class="form-check"> -
          <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
          <label class="form-check-label" for="invalidCheck">
            Agree to terms and conditions
          </label>
          <div class="invalid-feedback">
            You must agree before submitting.
          </div>
        </div>
      </div> -->
  
      <!-- Fluid theme -->
      <section>
      <button id="toggleTheme" class="floating-theme-btn">
          <i class="bi bi-moon-stars-fill"></i>
      </button>
      <script>
        document.addEventListener('DOMContentLoaded', function () {
            const button = document.getElementById('toggleTheme');
            const html = document.documentElement;
            const icon = button.querySelector('i');
        
            function applyTheme(theme) {
                html.setAttribute('data-bs-theme', theme);
        
                icon.className = theme === 'dark'
                    ? 'bi bi-sun-fill'
                    : 'bi bi-moon-stars-fill';
            }
        
            // Carregar tema salvo
            const savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);
        
            // Clique
            button.addEventListener('click', function () {
                const currentTheme = html.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        });
    </script>
      <!-- Fim fluid theme -->

      <div class="col-12">
        <button class="btn btn-primary" type="submit">Cadastrar</button>
      </div>
    </div>
    </form>

    <!-- Script erro -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      (() => {
          'use strict';

          const forms = document.querySelectorAll('.needs-validation');

          Array.from(forms).forEach(form => {
              form.addEventListener('submit', event => {
                  const senha = document.getElementById('senha').value;
                  const confirmarSenha = document.getElementById('confirmar_senha').value;

                  if (!form.checkValidity() || senha !== confirmarSenha) {
                      event.preventDefault();
                      event.stopPropagation();

                      if (senha !== confirmarSenha) {
                          document.getElementById('confirmar_senha').setCustomValidity('As senhas não coincidem.');
                      } else {
                          document.getElementById('confirmar_senha').setCustomValidity('');
                      }
                  } else {
                      document.getElementById('confirmar_senha').setCustomValidity('');
                  }

                  form.classList.add('was-validated');
              }, false);
          });
      })();
  </script>

  <!-- Fim Script eroo -->
   
    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
